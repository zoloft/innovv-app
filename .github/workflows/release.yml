name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Android release package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Check out SDK sibling
        run: git clone --depth 1 https://github.com/zoloft/innovv-sdk.git ../sdk

      - name: Derive version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Android release will be signed."
          else
            echo "No Android keystore secret configured; release artifacts will be unsigned."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release and debug APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease :androidApp:assembleDebug

      - name: Collect Android artifacts
        run: |
          mkdir -p artifacts/android
          for apk in androidApp/build/outputs/apk/release/*.apk; do
            if [[ "$apk" == *unsigned* ]]; then
              cp "$apk" "artifacts/android/innovv-app-${VERSION_NAME}-android-release-unsigned.apk"
            else
              cp "$apk" "artifacts/android/innovv-app-${VERSION_NAME}-android-release.apk"
            fi
          done
          cp androidApp/build/outputs/bundle/release/*.aab \
            "artifacts/android/innovv-app-${VERSION_NAME}-android-release.aab"
          cp androidApp/build/outputs/apk/debug/*.apk \
            "artifacts/android/innovv-app-${VERSION_NAME}-android-debug.apk"
          ls -lh artifacts/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/android/*
          if-no-files-found: error

  ios:
    name: iOS release package
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check out SDK sibling
        run: git clone --depth 1 https://github.com/zoloft/innovv-sdk.git ../sdk

      - name: Derive version from tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Detect iOS signing secrets
        id: ios_signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets configured; producing an unsigned device app only."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin/Native framework
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:compileKotlinIosArm64

      - name: Import Apple signing identity
        if: steps.ios_signing.outputs.available == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain

          echo "$IOS_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

          if [ -n "$IOS_PROVISIONING_PROFILE_SPECIFIER" ]; then
            echo "IOS_PROFILE_NAME=$IOS_PROVISIONING_PROFILE_SPECIFIER" >> "$GITHUB_ENV"
          else
            PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
              | plutil -extract Name raw -)
            echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          fi

      - name: Build signed iOS archive
        if: steps.ios_signing.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY || 'Apple Distribution' }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp-signed.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export signed IPA
        if: steps.ios_signing.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'app-store-connect' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${IOS_EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zoloft.innovv.app</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/iosApp-signed.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp build/ipa/*.ipa "artifacts/ios/innovv-app-${VERSION_NAME}-ios.ipa"

      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-device/Build/Products/Release-iphoneos/iosApp.app \
            "artifacts/ios/innovv-app-${VERSION_NAME}-ios-device-unsigned.zip"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/ios/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [android, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android
          path: artifacts/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: artifacts/ios

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenDash for INNOVV ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Downloads

            - **Android APK** — installable debug build plus release APK/AAB.
            - **iOS unsigned device app** — build artifact for inspection/local signing.
            - **iOS IPA** — produced when the Apple signing secrets are configured.

            Android release artifacts are signed when the
            `ANDROID_KEYSTORE_*` repository secrets are configured. Otherwise the
            release APK/AAB is unsigned and the debug APK is provided for testing.
          files: |
            artifacts/android/*
            artifacts/ios/*
            artifacts/checksums.txt
          fail_on_unmatched_files: true
