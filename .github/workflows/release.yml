name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Android release package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Check out SDK sibling
        run: git clone --depth 1 https://github.com/zoloft/innovv-sdk.git ../sdk

      - name: Derive version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Android release will be signed."
          else
            echo "No Android keystore secret configured; release artifacts will be unsigned."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release and debug APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease :composeApp:assembleDebug

      - name: Collect Android artifacts
        run: |
          mkdir -p artifacts/android
          for apk in composeApp/build/outputs/apk/release/*.apk; do
            if [[ "$apk" == *unsigned* ]]; then
              cp "$apk" "artifacts/android/innovv-app-${VERSION_NAME}-android-release-unsigned.apk"
            else
              cp "$apk" "artifacts/android/innovv-app-${VERSION_NAME}-android-release.apk"
            fi
          done
          cp composeApp/build/outputs/bundle/release/*.aab \
            "artifacts/android/innovv-app-${VERSION_NAME}-android-release.aab"
          cp composeApp/build/outputs/apk/debug/*.apk \
            "artifacts/android/innovv-app-${VERSION_NAME}-android-debug.apk"
          ls -lh artifacts/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/android/*
          if-no-files-found: error

  ios:
    name: iOS release package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check out SDK sibling
        run: git clone --depth 1 https://github.com/zoloft/innovv-sdk.git ../sdk

      - name: Derive version from tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin/Native framework
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Package iOS simulator app
        run: |
          mkdir -p artifacts/ios
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-sim/Build/Products/Release-iphonesimulator/iosApp.app \
            "artifacts/ios/innovv-app-${VERSION_NAME}-ios-simulator.zip"

      - name: Build unsigned iOS device archive
        continue-on-error: true
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive
          ditto -c -k --sequesterRsrc --keepParent \
            build/iosApp.xcarchive \
            "artifacts/ios/innovv-app-${VERSION_NAME}-ios-unsigned.xcarchive.zip"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/ios/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android
          path: artifacts/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: artifacts/ios

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: INNOVV Open Cam ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Downloads

            - **Android APK** — installable debug build plus release APK/AAB.
            - **iOS simulator app** — runnable in Xcode Simulator.
            - **iOS unsigned archive** — for inspection/signing; a signed device IPA
              requires Apple signing credentials and is not produced by this
              workflow yet.

            Android release artifacts are signed when the
            `ANDROID_KEYSTORE_*` repository secrets are configured. Otherwise the
            release APK/AAB is unsigned and the debug APK is provided for testing.
          files: |
            artifacts/android/*
            artifacts/ios/*
            artifacts/checksums.txt
          fail_on_unmatched_files: true
